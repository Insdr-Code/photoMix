name: photmix_app
description: "Editor móvil de composiciones fotográficas por capas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  image: ^4.13.1
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  share_plus: ^13.3.1
  sqflite: ^2.4.6
  tflite_flutter: ^0.12.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/deeplab_v3.tflite
